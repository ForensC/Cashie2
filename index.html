<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>個人財務儀表板</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--bg2:#0f172a;--bg3:#1e293b;
  --text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.12);
  --green:#22c55e;--red:#ef4444;--amber:#f59e0b;--blue:#3b82f6;
  --r:10px;--rl:16px;
}
body{font-family:'Noto Sans TC',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
input:focus{outline:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Header */
#hd{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
#hd-l{display:flex;align-items:center;gap:10px}
#hd-l h1{font-size:15px;font-weight:800;letter-spacing:-.02em;font-family:'Syne',sans-serif}
#hd-l small{font-size:11px;color:var(--text3)}
#hd-r{display:flex;align-items:center;gap:8px}
#sync-btn{padding:5px 12px;border-radius:8px;border:1px solid #334155;background:transparent;cursor:pointer;font-size:11px;color:var(--text2);font-family:inherit;display:flex;align-items:center;gap:5px;transition:all .15s}
#sync-btn:hover{background:var(--bg3);color:var(--text)}
#sync-btn.loading{opacity:.6;pointer-events:none}
#sync-time{font-size:11px;color:var(--text3)}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s infinite;flex-shrink:0}

/* Layout */
#wrap{max-width:960px;margin:0 auto;padding:20px 16px}

/* Status */
#status{background:rgba(59,130,246,0.08);border:1px solid rgba(59,130,246,0.2);border-radius:var(--r);padding:10px 14px;margin-bottom:16px;font-size:12px;color:#93c5fd;display:none;align-items:center;gap:8px}
#status.err{background:rgba(239,68,68,0.08);border-color:rgba(239,68,68,0.25);color:#fca5a5}

/* Tabs */
.tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tab{padding:9px 18px;border:none;border-bottom:2px solid transparent;background:transparent;cursor:pointer;font-size:13px;color:var(--text3);font-family:inherit;transition:all .15s;margin-bottom:-1px}
.tab:hover{color:var(--text2)}
.tab.on{color:var(--text);font-weight:600;border-bottom-color:var(--green)}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:var(--rl);padding:20px 22px}
.kpi-l{font-size:12px;color:var(--text3);letter-spacing:.06em;margin-bottom:8px}
.kpi-v{font-size:22px;font-weight:700;font-family:'DM Mono',monospace;letter-spacing:-.02em}
.kpi-s{font-size:12px;color:var(--text3);margin-top:4px}
.kv-def{color:var(--text)}.kv-pos{color:var(--green)}.kv-neg{color:var(--red)}.kv-amb{color:var(--amber)}

/* Cards */
.card{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:var(--rl);padding:20px;margin-bottom:14px;overflow:hidden}
.card-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card-t{font-size:13px;color:var(--text3)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:580px){.two-col{grid-template-columns:1fr}}

/* Table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:10px 14px;text-align:right;font-size:11px;font-weight:500;color:var(--text3);border-bottom:1px solid #1e293b;white-space:nowrap;background:rgba(0,0,0,0.2);letter-spacing:.04em}
th:first-child{text-align:left}
td{padding:12px 14px;border-bottom:1px solid #0f172a;text-align:right;color:var(--text);vertical-align:middle}
td:first-child{text-align:left}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,0.025)}
tr:nth-child(even) td{background:rgba(255,255,255,0.012)}
.mn{font-family:'DM Mono',monospace}
.pos{color:var(--green);font-family:'DM Mono',monospace}
.neg{color:var(--red);font-family:'DM Mono',monospace}
.amb{color:var(--amber);font-family:'DM Mono',monospace}
.blu{color:var(--blue);font-family:'DM Mono',monospace;font-weight:700}

/* Badge */
.badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600;background:rgba(255,255,255,0.06);color:var(--text2);border:1px solid var(--border2)}

/* Chart */
.chart-wrap{position:relative;height:220px}

/* Misc */
.empty{text-align:center;padding:40px;color:var(--text3);font-size:13px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #1e293b;border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}
.note{font-size:11px;color:var(--text3);margin-top:10px;padding:10px 14px;background:rgba(255,255,255,0.03);border-radius:8px;border:1px solid var(--border)}
</style>
</head>
<body>

<div id="hd">
  <div id="hd-l">
    <div class="live-dot"></div>
    <div>
      <h1>個人財務儀表板</h1>
      <small>資料來源：Google Sheets</small>
    </div>
  </div>
  <div id="hd-r">
    <span id="sync-time"></span>
    <button id="sync-btn" onclick="onRefresh()">
      <span class="spin" id="btn-spin" style="display:none"></span>
      <span>重新整理</span>
    </button>
  </div>
</div>

<div id="wrap">
  <div id="status"></div>
  <div class="tabs">
    <button class="tab on" data-tab="passive">被動配置</button>
    <button class="tab" data-tab="active">主動投資</button>
    <button class="tab" data-tab="cf">現金流</button>
    <button class="tab" data-tab="coll">收藏</button>
  </div>
  <div id="passive-root"></div>
  <div id="content" style="display:none"><div class="empty"><span class="spin"></span> 載入中...</div></div>
</div>

<!-- ── Non-passive tab logic ───────────────────────────────── -->
<script>
const SHEET_ID = '1IKi0HiVDa8UmPwEgU9zQ5RJ78UwPWZJFtwMkABTJKfs';
const SHEETS = { active:'主動投資', cf:'現金流', coll:'收藏' };

const fmt = {
  n:  v => (v==null||isNaN(v)) ? '—' : Math.round(v).toLocaleString('zh-TW'),
  p2: v => (v==null||isNaN(v)) ? '—' : `${v>=0?'+':''}${(v*100).toFixed(2)}%`,
  p1: v => (v==null||isNaN(v)) ? '—' : `${(v*100).toFixed(1)}%`,
  d:  v => v ? String(v).slice(0,10) : '—',
};
const cls = v => v==null||isNaN(v) ? 'mn' : v>0 ? 'pos' : v<0 ? 'neg' : 'mn';

const cache = {};
async function fetchSheet(name) {
  if (cache[name]) return cache[name];
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(name)}`;
  const res = await fetch(url);
  const text = await res.text();
  const json = JSON.parse(text.replace(/^[^(]+\(/, '').replace(/\);?\s*$/, ''));
  if (json.status !== 'ok') throw new Error(json.errors?.[0]?.message || 'Sheets error');
  cache[name] = (json.table.rows || []).map(r => (r.c || []).map(c => c ? (c.f ?? c.v) : null));
  return cache[name];
}

const charts = {};
function destroyCharts() {
  Object.values(charts).forEach(c => { try { c.destroy(); } catch(e){} });
  Object.keys(charts).forEach(k => delete charts[k]);
}

function showStatus(msg, isErr=false) {
  const el = document.getElementById('status');
  el.style.display = 'flex'; el.className = isErr ? 'err' : '';
  el.innerHTML = isErr ? `⚠ ${msg}` : `<span class="spin"></span> ${msg}`;
}
function hideStatus() { document.getElementById('status').style.display = 'none'; }

let currentTab = 'passive';

document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  currentTab = b.dataset.tab;
  if (currentTab === 'passive') {
    document.getElementById('passive-root').style.display = '';
    document.getElementById('content').style.display = 'none';
    hideStatus();
  } else {
    document.getElementById('passive-root').style.display = 'none';
    document.getElementById('content').style.display = '';
    renderTab();
  }
}));

function onRefresh() {
  if (currentTab === 'passive') {
    if (window.__passiveReload) window.__passiveReload();
    return;
  }
  const btn = document.getElementById('sync-btn');
  const spin = document.getElementById('btn-spin');
  btn.classList.add('loading'); spin.style.display = 'inline-block';
  Object.keys(cache).forEach(k => delete cache[k]);
  showStatus('正在從 Google Sheets 讀取資料...');
  Promise.all(Object.values(SHEETS).map(fetchSheet))
    .then(() => {
      hideStatus();
      document.getElementById('sync-time').textContent = '更新於 ' + new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
      renderTab();
    })
    .catch(e => {
      showStatus('無法讀取試算表。錯誤：' + e.message, true);
      document.getElementById('content').innerHTML = '<div class="empty">讀取失敗，請按「重新整理」重試</div>';
    })
    .finally(() => { btn.classList.remove('loading'); spin.style.display = 'none'; });
}

function renderTab() {
  destroyCharts();
  if (currentTab === 'active') renderActive();
  else if (currentTab === 'cf') renderCF();
  else if (currentTab === 'coll') renderColl();
}

// ── 主動投資 ──────────────────────────────────────────────────
function renderActive() {
  const rows = cache[SHEETS.active] || [];
  if (!rows.length) { document.getElementById('content').innerHTML = '<div class="empty"><span class="spin"></span> 載入中...</div>'; return; }
  const data = rows.slice(3).filter(r => r[0] && r[0] !== '合計');
  const ytdBase   = parseFloat(rows[1]?.[13]) || null;
  const totalMV   = data.reduce((s,r) => s + (parseFloat(r[5])||0), 0);
  const totalCost = data.reduce((s,r) => s + (parseFloat(r[2]||0) * parseFloat(r[3]||0)), 0);
  const totalPnL  = data.reduce((s,r) => s + (parseFloat(r[6])||0), 0);
  const totalRet  = totalCost > 0 ? totalPnL / totalCost : null;
  const ytdRet    = ytdBase && ytdBase > 0 ? (totalMV - ytdBase) / ytdBase : null;

  const tableRows = data.map(r => {
    const ret = parseFloat(r[7]);
    return `<tr>
      <td class="blu">${r[0]}</td>
      <td><span class="badge">${r[1]==='US'?'🇺🇸 美股':'🇹🇼 台股'}</span></td>
      <td class="mn">${fmt.n(parseFloat(r[2]))}</td>
      <td class="mn">${parseFloat(r[3]).toFixed(2)}</td>
      <td class="mn">${parseFloat(r[4]).toFixed(2)}</td>
      <td class="mn">${fmt.n(parseFloat(r[5]))}</td>
      <td class="${cls(parseFloat(r[6]))}">${fmt.n(parseFloat(r[6]))}</td>
      <td class="${cls(ret)}" style="font-weight:600">${fmt.p2(ret)}</td>
      <td style="font-size:11px;color:var(--text3)">${fmt.d(r[8])}</td>
    </tr>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-l">目前市值</div><div class="kpi-v kv-def">${fmt.n(totalMV)}</div></div>
      <div class="kpi"><div class="kpi-l">總投入成本</div><div class="kpi-v kv-def">${fmt.n(totalCost)}</div></div>
      <div class="kpi"><div class="kpi-l">未實現損益</div><div class="kpi-v ${totalPnL>=0?'kv-pos':'kv-neg'}">${fmt.n(totalPnL)}</div><div class="kpi-s">${fmt.p2(totalRet)}</div></div>
      <div class="kpi"><div class="kpi-l">今年績效 (YTD)</div><div class="kpi-v ${ytdRet!=null?(ytdRet>=0?'kv-pos':'kv-neg'):'kv-def'}">${ytdRet!=null?fmt.p2(ytdRet):'—'}</div><div class="kpi-s">${ytdBase?'基準 '+fmt.n(ytdBase):'請填 N2 年初市值'}</div></div>
    </div>
    <div class="card">
      <div class="card-hd"><span class="card-t">持倉明細</span></div>
      ${data.length ? `<div class="tbl-wrap"><table>
        <thead><tr><th style="text-align:left">標的</th><th>市場</th><th>股數</th><th>均價</th><th>現價</th><th>市值</th><th>損益</th><th>投報率</th><th>買入日</th></tr></thead>
        <tbody>${tableRows}</tbody>
      </table></div>` : '<div class="empty">試算表中尚無資料</div>'}
      <div class="note">💡 請在 Google Sheets「主動投資」頁面更新現價（E欄），並在 N2 填入年初市值以計算 YTD 績效</div>
    </div>`;
}

// ── 現金流 ────────────────────────────────────────────────────
function renderCF() {
  const rows = cache[SHEETS.cf] || [];
  if (!rows.length) { document.getElementById('content').innerHTML = '<div class="empty"><span class="spin"></span> 載入中...</div>'; return; }
  const data = rows.slice(3).filter(r => r[0]);
  const n = data.length || 1;
  const avgInc = data.reduce((s,r)=>s+(parseFloat(r[1])||0),0)/n;
  const avgFix = data.reduce((s,r)=>s+(parseFloat(r[2])||0),0)/n;
  const avgVrb = data.reduce((s,r)=>s+(parseFloat(r[3])||0),0)/n;
  const avgInv = data.reduce((s,r)=>s+(parseFloat(r[4])||0),0)/n;
  const avgSav = avgInc > 0 ? (avgInc-avgFix-avgVrb)/avgInc : null;
  const recent = data.slice(-12);

  const tableRows = [...data].reverse().slice(0,24).map(r => {
    const sv = parseFloat(r[5]), sr = parseFloat(r[6]);
    return `<tr>
      <td class="mn">${r[0]}</td>
      <td class="pos">${fmt.n(parseFloat(r[1]))}</td>
      <td class="mn">${fmt.n(parseFloat(r[2]))}</td>
      <td class="mn">${fmt.n(parseFloat(r[3]))}</td>
      <td class="amb">${fmt.n(parseFloat(r[4]))}</td>
      <td class="${cls(sv)}">${fmt.n(sv)}</td>
      <td class="${sr>=0.2?'amb':'mn'}">${fmt.p1(sr)}</td>
      <td style="font-size:11px;color:var(--text3)">${r[8]||''}</td>
    </tr>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-l">月均收入</div><div class="kpi-v ${data.length?'kv-pos':'kv-def'}">${data.length?fmt.n(avgInc):'—'}</div></div>
      <div class="kpi"><div class="kpi-l">月均固定支出</div><div class="kpi-v kv-def">${data.length?fmt.n(avgFix):'—'}</div></div>
      <div class="kpi"><div class="kpi-l">月均變動支出</div><div class="kpi-v kv-def">${data.length?fmt.n(avgVrb):'—'}</div></div>
      <div class="kpi"><div class="kpi-l">月均投資支出</div><div class="kpi-v ${data.length?'kv-amb':'kv-def'}">${data.length?fmt.n(avgInv):'—'}</div></div>
      <div class="kpi"><div class="kpi-l">平均儲蓄率</div><div class="kpi-v ${avgSav!=null&&avgSav>=0.2?'kv-amb':'kv-def'}">${data.length?fmt.p1(avgSav):'—'}</div></div>
    </div>
    ${recent.length ? `<div class="card">
      <div class="card-hd"><span class="card-t">近 ${recent.length} 個月支出分布</span></div>
      <div class="chart-wrap"><canvas id="cf-chart"></canvas></div>
    </div>` : ''}
    <div class="card">
      <div class="card-hd"><span class="card-t">月度記錄</span></div>
      ${data.length ? `<div class="tbl-wrap"><table>
        <thead><tr><th style="text-align:left">月份</th><th>收入</th><th>固定</th><th>變動</th><th>投資</th><th>淨儲蓄</th><th>儲蓄率</th><th>備註</th></tr></thead>
        <tbody>${tableRows}</tbody>
      </table></div>` : '<div class="empty">試算表中尚無資料</div>'}
    </div>`;

  if (recent.length) {
    charts.cf = new Chart(document.getElementById('cf-chart'), {
      type: 'bar',
      data: {
        labels: recent.map(r=>String(r[0]).slice(5)),
        datasets: [
          { label:'固定支出', data:recent.map(r=>parseFloat(r[2])||0), backgroundColor:'#3b82f6', stack:'e' },
          { label:'變動支出', data:recent.map(r=>parseFloat(r[3])||0), backgroundColor:'#8b5cf6', stack:'e' },
          { label:'投資支出', data:recent.map(r=>parseFloat(r[4])||0), backgroundColor:'#f59e0b', stack:'e' },
        ]
      },
      options: {
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ labels:{ color:'#94a3b8', font:{size:11}, boxWidth:10, padding:10 } } },
        scales:{
          x:{ ticks:{color:'#64748b',font:{size:11}}, grid:{display:false} },
          y:{ ticks:{ color:'#64748b', font:{size:11}, callback: v => v>=10000?(v/10000).toFixed(0)+'萬':v }, grid:{color:'rgba(255,255,255,0.05)'} }
        }
      }
    });
  }
}

// ── 收藏 ──────────────────────────────────────────────────────
function renderColl() {
  const rows = cache[SHEETS.coll] || [];
  if (!rows.length) { document.getElementById('content').innerHTML = '<div class="empty"><span class="spin"></span> 載入中...</div>'; return; }
  const data = rows.slice(3).filter(r => r[0]);
  const totalCost = data.reduce((s,r)=>s+(parseFloat(r[3])||0),0);
  const totalVal  = data.reduce((s,r)=>s+(parseFloat(r[4])||0),0);
  const totalGain = totalVal - totalCost;
  const catMap = {};
  data.forEach(r => { const c=r[1]||'其他'; catMap[c]=(catMap[c]||0)+(parseFloat(r[3])||0); });

  const tableRows = data.map(r => {
    const gain = parseFloat(r[5]);
    return `<tr>
      <td style="max-width:200px">${r[0]}</td>
      <td><span class="badge">${r[1]||''}</span></td>
      <td style="font-size:11px;color:var(--text3)">${fmt.d(r[2])}</td>
      <td class="mn">${fmt.n(parseFloat(r[3]))}</td>
      <td class="mn">${fmt.n(parseFloat(r[4]))}</td>
      <td class="${cls(gain)}">${fmt.n(gain)}</td>
      <td style="font-size:11px;color:var(--text3);max-width:150px">${r[6]||''}</td>
    </tr>`;
  }).join('');

  const COLORS = ['#22c55e','#3b82f6','#f59e0b','#8b5cf6','#ef4444','#06b6d4','#ec4899'];
  document.getElementById('content').innerHTML = `
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-l">總件數</div><div class="kpi-v kv-def">${data.length} 件</div></div>
      <div class="kpi"><div class="kpi-l">總入手成本</div><div class="kpi-v kv-def">${fmt.n(totalCost)}</div></div>
      <div class="kpi"><div class="kpi-l">目前估值</div><div class="kpi-v kv-def">${fmt.n(totalVal)}</div></div>
      <div class="kpi"><div class="kpi-l">估值損益</div><div class="kpi-v ${totalGain>=0?'kv-pos':'kv-neg'}">${fmt.n(totalGain)}</div></div>
    </div>
    ${Object.keys(catMap).length ? `<div class="card">
      <div class="card-hd"><span class="card-t">分類成本分布</span></div>
      <div class="chart-wrap"><canvas id="coll-pie"></canvas></div>
    </div>` : ''}
    <div class="card">
      <div class="card-hd"><span class="card-t">收藏清單</span></div>
      ${data.length ? `<div class="tbl-wrap"><table>
        <thead><tr><th style="text-align:left">名稱</th><th>分類</th><th>入手日</th><th>成本</th><th>估值</th><th>損益</th><th>備註</th></tr></thead>
        <tbody>${tableRows}</tbody>
      </table></div>` : '<div class="empty">試算表中尚無資料</div>'}
    </div>`;

  const catEntries = Object.entries(catMap);
  if (catEntries.length) {
    charts.collPie = new Chart(document.getElementById('coll-pie'), {
      type: 'doughnut',
      data: {
        labels: catEntries.map(([k])=>k),
        datasets:[{ data:catEntries.map(([,v])=>v), backgroundColor:COLORS.slice(0,catEntries.length), borderWidth:2, borderColor:'rgba(0,0,0,0.2)' }]
      },
      options: {
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ position:'right', labels:{ color:'#94a3b8', font:{size:11}, boxWidth:10, padding:8 } } }
      }
    });
  }
}

/* ── CSV ────────────────────────────────────────────────────── */
function parseCsv(text) {
  const lines = text.trim().split("\n");
  if (lines.length < 2) return [];
  const headers = parseRow(lines[0]);
  return lines.slice(1).map(line => {
    const vals = parseRow(line), obj = {};
    headers.forEach((h, i) => { obj[h.trim()] = (vals[i] ?? "").trim(); });
    return obj;
  }).filter(r => Object.values(r).some(v => v !== ""));
}
function parseRow(line) {
  const res = []; let cur = "", q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { if (q && line[i+1] === '"') { cur += '"'; i++; } else q = !q; }
    else if (c === ',' && !q) { res.push(cur); cur = ""; }
    else cur += c;
  }
  return [...res, cur];
}
const pnum = s => parseFloat(String(s||0).replace(/[NT$,%\s]/g,"")) || 0;
const ppct = s => { const v = pnum(s); return Math.abs(v) < 1 && v !== 0 ? v * 100 : v; };

const pfmt  = (n,d=0) => isNaN(n)||n==null?"—":n.toLocaleString("zh-TW",{maximumFractionDigits:d});
const pfmtP = n => isNaN(n)?"—":(n>=0?"+":"")+n.toFixed(2)+"%";

/* ── SVG 圓餅圖 ─────────────────────────────────────────────── */
function PieChart({ data, size=180 }) {
  const r = size/2, cx = r, cy = r, ir = r*0.54, or = r*0.82;
  const total = data.reduce((s,d)=>s+d.value,0);
  let angle = -Math.PI/2;
  const slices = data.map(d => {
    const sweep = (d.value/total)*Math.PI*2;
    const a1=angle, a2=angle+sweep; angle=a2;
    const x1=cx+or*Math.cos(a1), y1=cy+or*Math.sin(a1);
    const x2=cx+or*Math.cos(a2), y2=cy+or*Math.sin(a2);
    const xi1=cx+ir*Math.cos(a1), yi1=cy+ir*Math.sin(a1);
    const xi2=cx+ir*Math.cos(a2), yi2=cy+ir*Math.sin(a2);
    const lg=sweep>Math.PI?1:0;
    const path=`M${xi1},${yi1} L${x1},${y1} A${or},${or} 0 ${lg},1 ${x2},${y2} L${xi2},${yi2} A${ir},${ir} 0 ${lg},0 ${xi1},${yi1} Z`;
    return { ...d, path, pct:(d.value/total*100).toFixed(1) };
  });
  return (
    <div style={{display:"flex",alignItems:"center",gap:20,flexWrap:"wrap"}}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        {slices.map((s,i)=><path key={i} d={s.path} fill={MC[s.market]||"#94a3b8"} opacity={0.9}/>)}
      </svg>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {slices.map((s,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:8,fontSize:12}}>
            <div style={{width:10,height:10,borderRadius:2,background:MC[s.market]||"#94a3b8",flexShrink:0}}/>
            <span style={{color:"#94a3b8"}}>{s.label}</span>
            <span style={{fontFamily:"'DM Mono',monospace",color:"#e2e8f0"}}>{s.pct}%</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── SVG 折線圖 ─────────────────────────────────────────────── */
function LineChart({ data, height=240 }) {
  const ref = useRef(null);
  const [w, setW] = useState(600);
  useEffect(()=>{
    if(!ref.current) return;
    const ro = new ResizeObserver(e=>setW(e[0].contentRect.width));
    ro.observe(ref.current);
    return ()=>ro.disconnect();
  },[]);
  if (!data || data.length === 0) return null;
  const pad={t:16,r:16,b:56,l:60};
  const iw=Math.max(w-pad.l-pad.r,10), ih=height-pad.t-pad.b;
  const vals=data.map(d=>d.value);
  const minV=Math.min(...vals), maxV=Math.max(...vals), range=maxV-minV||1;
  const px=i=>pad.l+(i/(data.length-1))*iw;
  const py=v=>pad.t+ih-((v-minV)/range)*ih;
  const pts=data.map((d,i)=>`${px(i)},${py(d.value)}`).join(" ");
  const area=`M${px(0)},${py(data[0].value)} `+data.map((d,i)=>`L${px(i)},${py(d.value)}`).join(" ")+` L${px(data.length-1)},${pad.t+ih} L${px(0)},${pad.t+ih} Z`;
  const yTicks=Array.from({length:5},(_,i)=>minV+(maxV-minV)*(i/4));
  const [tip,setTip]=useState(null);
  return (
    <div ref={ref} style={{width:"100%"}}>
      <svg width="100%" height={height} style={{overflow:"visible"}}>
        <defs>
          <linearGradient id="pag" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#22c55e" stopOpacity={0.28}/>
            <stop offset="100%" stopColor="#22c55e" stopOpacity={0}/>
          </linearGradient>
        </defs>
        {yTicks.map((v,i)=>(
          <g key={i}>
            <line x1={pad.l} y1={py(v)} x2={pad.l+iw} y2={py(v)} stroke="#1e293b" strokeDasharray="3,3"/>
            <text x={pad.l-8} y={py(v)+4} textAnchor="end" fill="#64748b" fontSize={10}>{(v/10000).toFixed(0)}萬</text>
          </g>
        ))}
        {data.map((d,i)=>{
          const rotate=data.length>8, xPos=px(i), yPos=pad.t+ih+18;
          return rotate
            ? <text key={i} x={xPos} y={yPos} textAnchor="end" fill="#64748b" fontSize={10} transform={`rotate(-40,${xPos},${yPos})`}>{d.month}</text>
            : <text key={i} x={xPos} y={yPos} textAnchor="middle" fill="#64748b" fontSize={10}>{d.month}</text>;
        })}
        <path d={area} fill="url(#pag)"/>
        <polyline points={pts} fill="none" stroke="#22c55e" strokeWidth={2.5} strokeLinejoin="round"/>
        {data.map((d,i)=>(
          <g key={i} onMouseEnter={()=>setTip({i,d})} onMouseLeave={()=>setTip(null)} style={{cursor:"pointer"}}>
            <circle cx={px(i)} cy={py(d.value)} r={tip?.i===i?6:4} fill="#22c55e" opacity={tip?.i===i?1:0.8}/>
            {tip?.i===i&&(
              <g>
                <rect x={px(i)-60} y={py(d.value)-38} width={120} height={28} rx={6} fill="#1e2433" stroke="#334155"/>
                <text x={px(i)} y={py(d.value)-20} textAnchor="middle" fill="#f1f5f9" fontSize={11} fontFamily="'DM Mono',monospace">{d.month}</text>
                <text x={px(i)} y={py(d.value)-8} textAnchor="middle" fill="#22c55e" fontSize={11} fontFamily="'DM Mono',monospace">NT${pfmt(d.value)}</text>
              </g>
            )}
          </g>
        ))}
      </svg>
    </div>
  );
}

                  ))}
                </div>
              </div>
            </div>
          )}

          {/* 再平衡 */}
          {tab==="rebalance"&&(
            <div>
              <div style={{...box,padding:24,marginBottom:20}}>
                <div style={{fontSize:13,color:"#64748b",marginBottom:12}}>本次新投入資金（TWD）</div>
                <div style={{display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}>
                  <span style={{color:"#64748b",fontSize:15}}>NT$</span>
                  <input type="text" placeholder="例如：50000" value={fund} onChange={e=>setFund(e.target.value)}
                    style={{background:"#1e293b",border:"1px solid #334155",borderRadius:10,padding:"10px 16px",color:"#f1f5f9",fontSize:15,fontFamily:"'DM Mono',monospace",width:200}}/>
                  {fundNum>0&&<span style={{fontSize:12,color:"#64748b"}}>再平衡總金額：NT${pfmt(total+fundNum)}</span>}
                </div>
              </div>
              <div style={{...box,padding:24}}>
                <div style={{fontSize:13,color:"#64748b",marginBottom:16}}>各標的再平衡建議</div>
                {rb.map(h=>{
                  const over=h.diffValue<0, noAct=Math.abs(h.diffValue)<1000;
                  return (
                    <div key={h.ticker} style={{padding:"16px 0",borderBottom:"1px solid #0f172a"}}>
                      <div style={{display:"flex",justifyContent:"space-between",marginBottom:8,flexWrap:"wrap",gap:8}}>
                        <div style={{display:"flex",gap:10,alignItems:"center"}}>
                          <span style={{fontFamily:"'DM Mono',monospace",fontWeight:700,color:"#e2e8f0",fontSize:15}}>{h.ticker}</span>
                          <PBadge market={h.market}/>
                        </div>
                        <div style={{textAlign:"right"}}>
                          {noAct
                            ? <span style={{fontSize:13,color:"#22c55e"}}>✓ 無需調整</span>
                            : <>
                                <div style={{fontSize:14,fontWeight:700,fontFamily:"'DM Mono',monospace",color:over?"#f59e0b":"#22c55e"}}>
                                  {over?"▼ 減少":"▲ 增加"} NT${pfmt(Math.abs(h.diffValue))}
                                </div>
                                <div style={{fontSize:11,color:"#64748b",marginTop:2}}>約 {h.approxShares.toFixed(2)} 股　@　{sym(h)}{pfmt(h.currentPrice,2)}</div>
                              </>
                          }
                        </div>
                      </div>
                      <div style={{fontSize:12,color:"#64748b",display:"flex",gap:12,flexWrap:"wrap"}}>
                        <span>現值 NT${pfmt(h.currentValue)}</span>
                        <span>→</span>
                        <span>目標 NT${pfmt(h.targetValue)} ({h.targetPct.toFixed(2)}%)</span>
                      </div>
                    </div>
                  );
                })}
                {fundNum<=0&&(
                  <div style={{marginTop:16,padding:12,background:"rgba(59,130,246,0.08)",borderRadius:10,border:"1px solid rgba(59,130,246,0.2)",fontSize:12,color:"#93c5fd"}}>
                    ↑ 填入新投入金額，計算最佳資金分配方式
                  </div>
                )}
              </div>
            </div>
          )}

          {/* 成長曲線 */}
          {tab==="growth"&&(
            <div style={{...box,padding:24}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:24,flexWrap:"wrap",gap:12}}>
                <div>
                  <div style={{fontSize:13,color:"#64748b"}}>每月資產總值</div>
                  <div style={{fontSize:24,fontWeight:700,fontFamily:"'DM Mono',monospace",color:"#22c55e",marginTop:4}}>NT${pfmt(md.at(-1)?.value||0)}</div>
                  {md.at(-1)?.note&&<div style={{fontSize:11,color:"#64748b",marginTop:4}}>{md.at(-1).note}</div>}
                </div>
                {md.length>=2&&(
                  <div style={{textAlign:"right"}}>
                    <div style={{fontSize:12,color:"#64748b"}}>累計成長（{md[0].month} 起）</div>
                    <div style={{fontSize:16,fontWeight:700,color:"#22c55e",fontFamily:"'DM Mono',monospace"}}>
                      {pfmtP(((md.at(-1).value-md[0].value)/md[0].value)*100)}
                    </div>
                  </div>
                )}
              </div>
              {md.length>0
                ? <LineChart data={md} height={260}/>
                : <div style={{textAlign:"center",color:"#64748b",padding:40}}>尚無月度資料，請在 passive_monthly 填入紀錄</div>
              }
            </div>
          )}

          {/* 年化報酬 */}
          {tab==="return"&&(
            <div>
              <div style={{background:"linear-gradient(135deg,rgba(34,197,94,0.12),rgba(16,185,129,0.06))",border:"1px solid rgba(34,197,94,0.25)",borderRadius:20,padding:"28px 32px",marginBottom:20}}>
                <div style={{fontSize:13,color:"#86efac",letterSpacing:"0.08em",marginBottom:8}}>當年度整體年化報酬（XIRR）</div>
                <div style={{fontSize:56,fontWeight:800,fontFamily:"'Syne',sans-serif",color:xirr!=null?(xirr>=0?"#22c55e":"#ef4444"):"#64748b",lineHeight:1,marginBottom:16}}>
                  {xirr!==null?(xirr>=0?"+":"")+xirr.toFixed(2)+"%":"—"}
                </div>
                <div style={{fontSize:11,color:"#64748b"}}>計算基準：{new Date().getFullYear()} 年初資產 → 今日總市值　｜　Sheets 更新後點「重新整理」即同步</div>
              </div>
              <div style={{...box,padding:24}}>
                <div style={{fontSize:13,color:"#64748b",marginBottom:16}}>持倉成本明細</div>
                <div style={{overflowX:"auto"}}>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:13,minWidth:560}}>
                    <thead>
                      <tr style={{color:"#64748b",borderBottom:"1px solid #1e293b"}}>
                        {["代號","市場","持股數","平均成本","現價","現值(TWD)"].map(h=>(
                          <th key={h} style={{textAlign:"left",padding:"8px 12px",fontWeight:500}}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {hs.map((h,i)=>(
                        <tr key={h.ticker} style={{borderBottom:"1px solid #0f172a",background:i%2===0?"transparent":"rgba(255,255,255,0.012)"}}>
                          <td style={{padding:"13px 12px",fontFamily:"'DM Mono',monospace",fontWeight:700,color:"#e2e8f0"}}>{h.ticker}</td>
                          <td style={{padding:"13px 12px"}}><PBadge market={h.market}/></td>
                          <td style={{padding:"13px 12px",fontFamily:"'DM Mono',monospace",color:"#94a3b8"}}>{pfmt(h.totalShares,4)}</td>
                          <td style={{padding:"13px 12px",fontFamily:"'DM Mono',monospace",color:"#94a3b8"}}>{sym(h)}{pfmt(h.avgCost,2)}</td>
                          <td style={{padding:"13px 12px",fontFamily:"'DM Mono',monospace",color:"#94a3b8"}}>{sym(h)}{pfmt(h.currentPrice,2)}</td>
                          <td style={{padding:"13px 12px",fontFamily:"'DM Mono',monospace",fontWeight:600,color:"#e2e8f0"}}>NT${pfmt(h.currentValue)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("passive-root")).render(<PassiveApp/>);
</script>
</body>
</html>
