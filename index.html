<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>FORICHES / FINANCE.OS</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg: oklch(0.745 0.013 240);
  --bg-2: oklch(0.71 0.014 240);
  --ink: #0d0d10;
  --ink-2: #161620;
  --ink-3: #22222c;
  --line: #2a2a36;
  --cream: #ece7dc;
  --cream-2: #d9d3c4;
  --paper: #f4efe3;
  --signal: oklch(0.62 0.22 25);
  --signal-2: oklch(0.56 0.22 25);
  --green: oklch(0.72 0.17 145);
  --amber: oklch(0.78 0.16 78);
  --blue: #2b6fbd;
}
html,body{background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
body{background-image:
  radial-gradient(circle at 12% 8%, oklch(0.78 0.014 240 / 0.6), transparent 40%),
  radial-gradient(circle at 90% 92%, oklch(0.68 0.016 240 / 0.5), transparent 45%);}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a2a36;border-radius:4px}
input:focus{outline:none}
.display{font-family:'Big Shoulders Display',sans-serif;font-weight:800;letter-spacing:.005em;line-height:.9;text-transform:uppercase}
.mono{font-family:'JetBrains Mono',monospace}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.2}}

/* shared atoms */
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:var(--cream);color:var(--ink);font-size:11px;font-weight:600;letter-spacing:.14em;border:1px solid rgba(0,0,0,.12)}
.chip.dark{background:var(--ink);color:var(--cream);border-color:rgba(255,255,255,.1)}
.chip .star{color:var(--signal);font-size:10px}
.pill-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;background:var(--ink);color:var(--cream);font-size:12px;letter-spacing:.12em;font-weight:600;border:none;cursor:pointer;transition:all .15s ease;font-family:inherit}
.pill-btn:hover{background:var(--signal);color:#fff;transform:translateY(-1px)}
.pill-btn.alt{background:transparent;color:var(--ink);border:1px solid rgba(13,13,16,.25)}
.pill-btn.alt:hover{background:var(--ink);color:var(--cream)}
.circle-btn{width:42px;height:42px;border-radius:50%;background:var(--ink);color:var(--cream);border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .15s ease;font-size:18px}
.circle-btn:hover{background:var(--signal);color:#fff;transform:rotate(180deg)}

/* HEADER */
#hd{padding:20px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;max-width:1280px;margin:0 auto}
.brand{display:flex;align-items:center;gap:14px}
.brand .logo{font-family:'Big Shoulders Display',sans-serif;font-size:30px;font-weight:800;color:var(--ink);letter-spacing:.02em;line-height:1}
.brand .logo span.dot{color:var(--signal)}
.brand .sub{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;opacity:.55;padding-left:14px;border-left:1px solid rgba(13,13,16,.2)}
.head-r{display:flex;align-items:center;gap:10px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2s infinite;flex-shrink:0}
.sync-time{font-size:10px;letter-spacing:.14em;color:var(--ink);opacity:.55;font-family:'JetBrains Mono',monospace}

/* TABS */
#wrap{max-width:1280px;margin:0 auto;padding:0 22px 60px}
.tabline{display:inline-flex;padding:4px;border-radius:999px;background:rgba(13,13,16,.08);border:1px solid rgba(13,13,16,.1);margin-bottom:18px;flex-wrap:wrap}
.tab{padding:10px 22px;border-radius:999px;background:transparent;border:none;cursor:pointer;font-family:'Big Shoulders Display',sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:15px;color:var(--ink);opacity:.55;transition:all .18s ease;font-family:'Big Shoulders Display',sans-serif}
.tab.on{background:var(--ink);color:var(--cream);opacity:1}
.tab .zh{font-family:'Noto Sans TC',sans-serif;margin-left:8px;letter-spacing:.04em;font-size:11px;opacity:.7}

/* STATUS */
#status{display:none;align-items:center;gap:10px;padding:12px 18px;border-radius:14px;margin-bottom:18px;background:var(--ink);color:var(--cream);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em}
#status.err{background:var(--signal);color:#fff}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle}

/* DARK CARD */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--ink);color:var(--cream);border-radius:24px;padding:22px 24px;position:relative;overflow:hidden}
.kpi.cream{background:var(--cream);color:var(--ink)}
.kpi-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;opacity:.55;margin-bottom:10px}
.kpi-value{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:42px;line-height:.9;letter-spacing:0}
.kpi-sub{font-family:'JetBrains Mono',monospace;font-size:11px;opacity:.6;margin-top:8px;letter-spacing:.05em}

/* TABLE */
.section{border-radius:24px;overflow:hidden;margin-bottom:14px}
.section.dark{background:var(--ink);color:var(--cream)}
.section.cream{background:var(--cream);color:var(--ink)}
.section-hd{padding:22px 26px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;border-bottom:1px solid rgba(255,255,255,.05)}
.section.cream .section-hd{border-bottom-color:rgba(13,13,16,.08)}
.section-title{font-family:'Big Shoulders Display',sans-serif;font-size:26px;font-weight:800;letter-spacing:.005em;line-height:1}
.section-sub{font-family:'JetBrains Mono',monospace;font-size:10px;opacity:.55;margin-top:4px;letter-spacing:.1em}
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px;min-width:680px}
table.t th{text-align:left;padding:14px 16px;font-weight:500;letter-spacing:.1em;font-size:10px;font-family:'JetBrains Mono',monospace;opacity:.55;white-space:nowrap}
table.t th .zh{display:block;font-family:'Noto Sans TC';font-size:9px;opacity:.6;font-weight:400;margin-top:2px}
table.t td{padding:16px;border-top:1px solid rgba(255,255,255,.05);vertical-align:middle}
.section.cream table.t td{border-top-color:rgba(13,13,16,.08)}
table.t tr:hover td{background:rgba(255,255,255,.03)}
.section.cream table.t tr:hover td{background:rgba(13,13,16,.03)}
.mn{font-family:'JetBrains Mono',monospace}
.pos{color:var(--green);font-family:'JetBrains Mono',monospace}
.neg{color:var(--signal);font-family:'JetBrains Mono',monospace}
.amb{color:var(--amber);font-family:'JetBrains Mono',monospace}
.code{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:22px;letter-spacing:.01em}

/* Badge */
.mbadge{display:inline-flex;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:3px 9px;letter-spacing:.08em;color:#fff}

.empty{text-align:center;padding:40px;font-family:'JetBrains Mono',monospace;font-size:11px;opacity:.55;letter-spacing:.12em}
.dot-grid{background-image:radial-gradient(currentColor 1px,transparent 1px);background-size:10px 10px;opacity:.45}

/* Ticker marquee */
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ticker-wrap{overflow:hidden;mask-image:linear-gradient(to right,transparent,#000 5%,#000 95%,transparent)}
.ticker{display:inline-flex;animation:ticker 60s linear infinite;white-space:nowrap}
.ticker.slow{animation-duration:90s}
.ticker > div{padding-right:48px;display:inline-flex;gap:18px;align-items:center}

/* Scale ticks (vertical bars next to vault label) */
.scale-ticks{display:flex;flex-direction:column;gap:6px}
.scale-ticks span{display:block;height:14px;background:var(--cream);border-radius:1px;font-size:9px;color:var(--ink);padding-left:4px;font-family:'JetBrains Mono',monospace;line-height:14px}
.scale-ticks span:nth-child(odd){background:var(--cream);color:var(--ink)}
.scale-ticks span.lit{background:var(--signal);color:#fff}
.scale-ticks.dark span{background:var(--ink);color:var(--cream)}
.scale-ticks.dark span:nth-child(odd){background:var(--cream);color:var(--ink)}

/* Corner brackets */
.bracket{position:relative}
.bracket::before,.bracket::after{content:'';position:absolute;width:14px;height:14px;border:1.5px solid currentColor}
.bracket::before{top:8px;left:8px;border-right:0;border-bottom:0}
.bracket::after{bottom:8px;right:8px;border-left:0;border-top:0}

/* Big stamp text */
.stamp{font-family:'Big Shoulders Display',sans-serif;font-weight:800;letter-spacing:.005em;line-height:.85;text-transform:uppercase}

/* Spark sticks */
.sparks{display:flex;align-items:flex-end;gap:3px;height:36px}
.sparks span{width:6px;background:var(--signal);border-radius:1px;display:block;transition:height .3s}

/* Subtle blink */
@keyframes softBlink{0%,100%{opacity:1}50%{opacity:.4}}
.blink{animation:softBlink 1.8s infinite}
</style>
</head>
<body>

<header id="hd">
  <div class="brand">
    <div class="logo">FORICHES<span class="dot">/</span>OS<span class="dot">.</span></div>
    <div class="sub">PERSONAL.FINANCE.COMMAND</div>
  </div>
  <div class="head-r">
    <div class="live-dot"></div>
    <span class="sync-time" id="sync-time">SYNCING...</span>
    <button class="circle-btn" id="sync-btn" title="重新整理" onclick="onRefresh()">↻</button>
  </div>
</header>

<div id="wrap">
  <div id="status"></div>

  <div class="tabline">
    <button class="tab on" data-tab="passive">PASSIVE<span class="zh">/ 被動配置</span></button>
    <button class="tab" data-tab="active">ACTIVE<span class="zh">/ 主動投資</span></button>
    <button class="tab" data-tab="cf">CASHFLOW<span class="zh">/ 現金流</span></button>
    <button class="tab" data-tab="coll">VAULT<span class="zh">/ 收藏</span></button>
  </div>

  <div id="passive-root"></div>
  <div id="content" style="display:none"><div class="empty"><span class="spin"></span> LOADING...</div></div>
</div>

<!-- shared helpers -->
<script>
const SHEET_ID      = '1IKi0HiVDa8UmPwEgU9zQ5RJ78UwPWZJFtwMkABTJKfs';
const COLL_SHEET_ID = '1-sPIxLJvK1Y5rB5TXZQss3O_-ZVy7oMvvIAtegDcxbg';
const SHEETS = { active:'active_positions', cf:'cashflow', cfCats:'cashflow_categories', coll:'collectibles', collSeries:'collectibles_series' };

const fmt = {
  n:  v => (v==null||isNaN(v)) ? '—' : Math.round(v).toLocaleString('zh-TW'),
  p2: v => (v==null||isNaN(v)) ? '—' : `${v>=0?'+':''}${(v*100).toFixed(2)}%`,
  p1: v => (v==null||isNaN(v)) ? '—' : `${(v*100).toFixed(1)}%`,
  d:  v => v ? String(v).slice(0,10) : '—',
};
const cls = v => v==null||isNaN(v) ? 'mn' : v>0 ? 'pos' : v<0 ? 'neg' : 'mn';

const cache = {};
async function fetchSheet(name, sid = SHEET_ID) {
  if (cache[name]) return cache[name];
  const url = `https://docs.google.com/spreadsheets/d/${sid}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(name)}`;
  const res = await fetch(url);
  const text = await res.text();
  const json = JSON.parse(text.replace(/^[^(]+\(/, '').replace(/\);?\s*$/, ''));
  if (json.status !== 'ok') throw new Error(json.errors?.[0]?.message || 'Sheets error');
  cache[name] = (json.table.rows || []).map(r => (r.c || []).map(c => c ? (c.f ?? c.v) : null));
  return cache[name];
}

const charts = {};
function destroyCharts(){ Object.values(charts).forEach(c=>{try{c.destroy()}catch(e){}}); Object.keys(charts).forEach(k=>delete charts[k]); }
function showStatus(msg, isErr=false){
  const el=document.getElementById('status');
  el.style.display='flex'; el.className=isErr?'err':'';
  el.innerHTML = isErr ? '⚠ ' + msg : '<span class="spin"></span> ' + msg;
}
function hideStatus(){ document.getElementById('status').style.display='none'; }

let currentTab = 'passive';

document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  currentTab = b.dataset.tab;
  if (currentTab === 'passive') {
    document.getElementById('passive-root').style.display = '';
    document.getElementById('content').style.display = 'none';
    hideStatus();
  } else {
    document.getElementById('passive-root').style.display = 'none';
    document.getElementById('content').style.display = '';
    renderTab();
  }
}));

function onRefresh() {
  if (currentTab === 'passive') { if (window.__passiveReload) window.__passiveReload(); return; }
  Object.keys(cache).forEach(k => delete cache[k]);
  showStatus('SYNCING FROM GOOGLE SHEETS...');
  Promise.all([
    fetchSheet(SHEETS.active, COLL_SHEET_ID),
    fetchSheet('active_watchlist', COLL_SHEET_ID).catch(()=>[]),
    fetchSheet('account_snapshots', COLL_SHEET_ID).catch(()=>[]),
    fetchSheet(SHEETS.cf,      COLL_SHEET_ID),
    fetchSheet(SHEETS.cfCats,  COLL_SHEET_ID),
    fetchSheet(SHEETS.coll,    COLL_SHEET_ID),
    fetchSheet(SHEETS.collSeries, COLL_SHEET_ID),
  ]).then(() => {
    hideStatus();
    document.getElementById('sync-time').textContent = 'SYNCED · ' + new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
    renderTab();
  }).catch(e => {
    showStatus('SYNC FAILED · ' + e.message, true);
    document.getElementById('content').innerHTML = '<div class="empty">DATA ERROR — RETRY</div>';
  });
}

function renderTab() {
  destroyCharts();
  if (currentTab === 'active') renderActive();
  else if (currentTab === 'cf') renderCF();
  else if (currentTab === 'coll') renderColl();
}

/* ─────────── ACTIVE TAB — see tabs/active.js ─────────── */

/* prefetch */
(async () => {
  try {
    await Promise.all([
      fetchSheet(SHEETS.active, COLL_SHEET_ID),
      fetchSheet('active_watchlist', COLL_SHEET_ID).catch(()=>[]),
      fetchSheet('account_snapshots', COLL_SHEET_ID).catch(()=>[]),
      fetchSheet(SHEETS.cf,      COLL_SHEET_ID),
      fetchSheet(SHEETS.cfCats,  COLL_SHEET_ID),
      fetchSheet(SHEETS.coll,    COLL_SHEET_ID),
      fetchSheet(SHEETS.collSeries, COLL_SHEET_ID),
    ]);
    document.getElementById('sync-time').textContent = 'SYNCED · ' + new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
  } catch(e) {
    document.getElementById('sync-time').textContent = 'OFFLINE';
  }
})();
</script>

<!-- per-tab logic in external files -->
<script src="tabs/active.js"></script>
<script src="tabs/cashflow.js"></script>
<script src="tabs/collections.js"></script>
<script type="text/babel" src="tabs/passive.jsx"></script>

</body>
</html>
